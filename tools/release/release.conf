# SPDX-License-Identifier: AGPL-3.0-or-later
# Oscairn plugin release configuration.
#
# The ONE place holding this repo's release facts. When copying this release setup to
# another Oscairn plugin fork, edit only this file; build.sh, check_deps.py,
# licenses.sh, manifest.py and selfcheck.py stay generic.
#
# KEY=VALUE, one per line, comments on their own line: sourced by POSIX sh and
# parsed by the Python scripts the same way.

NAME=oscairn-sampler
# File stem of each release asset: <NAME>-<platform>.clap

PACKAGE_ID=org.oscairn.sampler
PACKAGE_NAME="Oscairn Sampler"
PACKAGE_SUMMARY="Oscairn's sample-playback instrument."
# SPDX expression, as published in the packages repo.
LICENSE=AGPL-3.0-or-later
# synth | effect | note-effect:
PLUGIN_KIND=synth
# The plugin's own version lives in its clap_plugin_descriptor_t in this file:
PLUGIN_VERSION_FILE=src/identity.h
SOURCE_URL=https://github.com/oscairn/sampler
# Releases are tagged oscairn-vX.Y.Z (upstream v* tags exist in forks):
TAG_PREFIX=oscairn-
# CMake target producing the .clap:
CLAP_TARGET=oscairn-sampler
CLAP_VERSION_FILE=third_party/clap/include/clap/version.h
OSCAIRN_CLAP_UPSTREAM=third_party/oscairn-clap/upstream.json
# Licence/notice files the binary needs, as "path=licenses-name" pairs -> licenses/<name>:
LICENSE_FILES="LICENSE=oscairn-sampler-LICENSE CREDITS.md=CREDITS.md third_party/NOTICES.md=NOTICES.md third_party/clap/LICENSE=clap-LICENSE third_party/oscairn-clap/LICENSE=oscairn-clap-LICENSE third_party/sfizz-laws/LICENSE=sfizz-laws-LICENSE third_party/samplepack/LICENSE=samplepack-LICENSE"
# The init library: a library archive of one sound that the release ships beside the .clap, for a
# host to play the instrument with (oscairn-plugin-check --library/--sound). Leave these out
# when the plugin needs none. Its package version in the manifest is the plugin's own.
INIT_LIBRARY_ID=org.oscairn.sampler.init
INIT_LIBRARY_NAME="Sampler Init"
# Item id of its sound:
INIT_SOUND=91e9472ca6d0e6ac
INIT_FILE=oscairn-sampler-init.olib
